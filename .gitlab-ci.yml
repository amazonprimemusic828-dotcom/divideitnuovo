stages:
  - verify
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

default:
  image: node:22-bookworm-slim
  before_script:
    - npm ci --cache .npm --prefer-offline
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

# Unit tests use isolated fixtures, never production credentials.
unit-tests:
  stage: verify
  script:
    - npm test

# The target project's public publishable key is in .env.production.
# Remove stale Vercel/CI overrides, especially VITE_SUPABASE_ANON_KEY.
# Private deployment tokens remain protected CI/CD variables, never VITE_ vars.
frontend:
  stage: verify
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 7 days

# Read-only checks reject mismatched keys and verify Google is enabled.
supabase-connection:
  stage: verify
  before_script: []
  cache: []
  script:
    - node --env-file=.env.production scripts/test-supabase-connection.mjs

# Configure a rotated SUPABASE_ACCESS_TOKEN as a masked, hidden, protected
# CI/CD variable and protect the default branch. Never store it in the repo.
# No database push/reset or migrations are run. Hosted Auth URL/provider
# settings and service-specific secrets must be configured in Supabase.
deploy-functions:
  stage: deploy
  before_script: []
  cache: []
  resource_group: supabase-production
  environment:
    name: production
    url: https://gsdkunlnjirimxcoqwxd.supabase.co
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
  script:
    - ': "${SUPABASE_ACCESS_TOKEN:?Configure a rotated SUPABASE_ACCESS_TOKEN in GitLab CI/CD settings}"'
    # Do not overwrite payment-provider flags or existing service secrets.
    - npx --yes supabase@2 secrets set ENVIRONMENT=production --project-ref gsdkunlnjirimxcoqwxd
    # Discover all eight current entrypoints; include new functions automatically.
    - |
      set -eu
      for entrypoint in supabase/functions/*/index.ts; do
        test -f "$entrypoint"
        function_name=$(basename "$(dirname "$entrypoint")")
        npx --yes supabase@2 functions deploy "$function_name" --project-ref gsdkunlnjirimxcoqwxd --use-api
      done
