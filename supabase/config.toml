# Mirror these URL settings in the hosted project's Authentication settings.
# Deploying Edge Functions does not apply hosted Auth configuration.
[auth]
site_url = "https://divideitnuovo.vercel.app"
additional_redirect_urls = ["https://divideitnuovo.vercel.app/**"]

# These endpoints validate their own signature, cron secret or user JWT.
[functions.stripe-webhook]
verify_jwt = false

[functions.stripe-api]
verify_jwt = false

[functions.hold-release]
verify_jwt = false
